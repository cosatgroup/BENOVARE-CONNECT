databases:
  - name: benovare-connect-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: benovare-connect-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: benovare-connect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
