databases:
  - name: benovare-connect-db
    plan: free
    postgresMajorVersion: "16"

# Migrations versionnées (prisma/migrations). La base existait déjà (créée
# via `db push` avant l'introduction des migrations) : `migrate resolve
# --applied` marque la migration de référence comme déjà appliquée sans la
# rejouer, en échouant silencieusement (`|| true`) les fois suivantes où
# elle est déjà enregistrée. `migrate deploy` applique ensuite toute
# nouvelle migration ajoutée au dossier.
services:
  - type: web
    name: benovare-connect-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: (npx prisma migrate resolve --applied 20260101000000_init || true) && npx prisma migrate deploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: benovare-connect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # 32 octets aléatoires encodés en base64 — à générer et saisir
      # manuellement sur Render (ne pas utiliser generateValue, qui ne
      # garantit pas un format base64 32 octets exact) :
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: MFA_ENCRYPTION_KEY
        sync: false
      # Secret partagé avec le déclencheur externe (ex. cron-job.org) qui
      # appelle POST /api/veille/collecter à intervalle régulier, faute de
      # Cron Jobs Render sur le plan gratuit.
      - key: VEILLE_CRON_SECRET
        generateValue: true
      # Protège l'opération ponctuelle POST /api/maintenance/reencrypt-secrets
      # (rechiffrement des mfaSecret créés avant l'introduction du
      # chiffrement au repos). Peut être retiré une fois l'opération faite.
      - key: MAINTENANCE_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      # Abonnements et tarification (§7.4) — paiement KKiaPay/FedaPay et
      # virement bancaire. Clés à saisir manuellement une fois les comptes
      # KKiaPay/FedaPay créés ; tant qu'elles sont absentes, les routes de
      # paiement correspondantes répondent une erreur "Configuration
      # manquante" sans planter le service.
      - key: KKIAPAY_PUBLIC_KEY
        sync: false
      - key: KKIAPAY_PRIVATE_KEY
        sync: false
      - key: KKIAPAY_SECRET_KEY
        sync: false
      - key: KKIAPAY_SANDBOX
        value: "true"
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_ENVIRONMENT
        value: sandbox
      - key: FEDAPAY_WEBHOOK_SECRET
        sync: false
      - key: BANK_TRANSFER_INSTRUCTIONS
        sync: false
