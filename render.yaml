databases:
  - name: benovare-connect-db
    plan: free
    postgresMajorVersion: "16"

# NOTE: `prisma db push` (au lieu de `migrate deploy`) tant que le schéma
# bouge vite console par console — pas encore de fichiers de migration
# versionnés. À revoir vers `prisma migrate` une fois le modèle stabilisé.
services:
  - type: web
    name: benovare-connect-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: benovare-connect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # 32 octets aléatoires encodés en base64 — à générer et saisir
      # manuellement sur Render (ne pas utiliser generateValue, qui ne
      # garantit pas un format base64 32 octets exact) :
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
